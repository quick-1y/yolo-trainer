name: yolo-trainer

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: api
    image: yolo-trainer-api:local
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-WAL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Give uvicorn's graceful shutdown (and the WAL checkpoint it runs) time
    # to complete before compose sends SIGKILL (RESEARCH Pitfall 1 mitigation 2).
    stop_grace_period: 20s

  # The DB-polled job runner: the worker service claims queued training runs
  # from the shared SQLite database and trains them one at a time in a
  # subprocess inside this container (Phase 4). It also keeps the heartbeat
  # file alive. Phase 12's docker-compose.gpu.yml override (D-18) replaces
  # build.target and image here and adds a GPU device reservation - not
  # created in this phase.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: worker
    image: yolo-trainer-worker:cpu
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-WAL}
      # Never let Ultralytics pip-install a package at run time.
      YOLO_AUTOINSTALL: "false"
    # Migrations run when the api starts; the worker must not poll the run
    # table before they have finished.
    depends_on:
      api:
        condition: service_healthy
    # PyTorch data loaders need more shared memory than the Docker default
    # (used by the GPU path, harmless on CPU where workers=0).
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "yolo_trainer_worker.main", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      # torch/ultralytics import is slow on first start.
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: yolo-trainer-web:local
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
