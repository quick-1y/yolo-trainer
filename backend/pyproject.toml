[project]
name = "yolo-trainer-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_trainer_api", "src/yolo_trainer_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` default-argument pattern is intentional, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
